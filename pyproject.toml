[project]
name = "chronicle"
version = "0.1.0"
description = "Local viewer + migration toolkit for Claude/ChatGPT exports"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
dependencies = []  # core (synopsis.py, build_index.py, build_standalone.py) is stdlib-only

[project.urls]
Repository = "https://github.com/kemalbadur/chronicle"
Issues = "https://github.com/kemalbadur/chronicle/issues"

[project.optional-dependencies]
server = ["flask>=3.0"]      # app.py
docs = ["python-docx>=1.1"]  # build_userguide.py
mcp = ["mcp>=2.0"]           # mcp_server.py (2.0 renamed FastMCP -> MCPServer)
dev = ["pytest>=8.0", "ruff>=0.5", "mcp>=2.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "build_index", "build_standalone", "build_userguide",
              "chatgpt_export", "mcp_server", "store", "synopsis"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["migration_full", "project_listings"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"samples/build_samples.py" = ["E501"]  # long literal strings in sample conversations

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
